method: bitcons_at

epochs: 110
lr_init: 0.1
lr_scheduler: multi_step
lr_steps: [100, 105]
lr_gamma: 0.1
optimizer: sgd
momentum: 0.9
weight_decay: 5e-4

epsilon: 8
alpha: 2
n_steps: 10

perturbation: none

awp:
  gamma: 0.01
  warmup: 0

rwp:
  gamma: 0.01
  warmup: 0

# BitMax is the inner optimizer that supplies worst-case bit-plane views.
bitmax_planes: [0, 1, 2]
bitmax_candidates: 2
bitmax_refine_steps: 1

# Risk-adaptive worst-case BitCons. Set bitcons: false for BitMax-only.
bitcons: true
bitcons_contrast: false
bitcons_alpha: 0.05
bitcons_start_epoch: 20
bitcons_warmup: 40
bitcons_warmup_schedule: linear
bitcons_gain_tau: 0.5
bitcons_margin_threshold: 0.0
temperature: 1.0

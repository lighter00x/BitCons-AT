method: rpat

epochs: 110
lr_init: 0.1
lr_scheduler: multi_step
lr_steps: [100, 105]
lr_gamma: 0.1
optimizer: sgd
momentum: 0.9
weight_decay: 5e-4

epsilon: 8
alpha: 2
n_steps: 10

RA_start: 0
RA_ip_rate: 0.5
lam: 1.0

# Weight perturbation configuration
# Options: none (default), awp, rwp
perturbation: none

awp:
  gamma: 0.01
  warmup: 0

rwp:
  gamma: 0.01
  warmup: 0

# ── BitCons: Fragile Bit-Plane Masking Stream ─────────────────────────────
# Set bitcons: true to enable the third training stream.
bitcons: true
bitcons_planes: [3,4,5]      # bit-planes to zero out (0=LSB, 7=MSB)
bitcons_align: kl              # js | kl | mse | kl_zscore
temperature: 0.5               # softmax temperature for js alignment
bitcons_alpha: 1              # final alignment loss weight α
bitcons_warmup: 100             # epochs to ramp α from 0 → bitcons_alpha (0 = no warmup)
bitcons_warmup_schedule: linear  # linear | cosine
# ── BitCons Feature Contrastive Loss ──────────────────────────────────────
# NT-Xent on penultimate-layer features; requires bitcons: true
# Positive : (feat_bc_i, feat_adv_i)   reliable-bit vs adversarial, same image
# Negatives: (feat_bc_i, feat_ub_j)    reliable-bit vs unreliable-bit (all j)
#          + (feat_bc_i, feat_adv_j)   cross-sample adversarial (j≠i)
bitcons_contrast: true
bitcons_contrast_lam: 1.0   # weight relative to bc_alpha
bitcons_contrast_temp: 0.5  # NT-Xent temperature τ
# ──────────────────────────────────────────────────────────────────────────

method: rpat

epochs: 110
lr_init: 0.1
lr_scheduler: multi_step
lr_steps: [100, 105]
lr_gamma: 0.1
optimizer: sgd
momentum: 0.9
weight_decay: 5e-4

epsilon: 8
alpha: 2
n_steps: 10

RA_start: 0
RA_ip_rate: 0.5
lam: 1.0

# Weight perturbation configuration
# Options: none (default), awp, rwp
perturbation: none

awp:
  gamma: 0.01
  warmup: 0

rwp:
  gamma: 0.01
  warmup: 0

# ── BitCons: Fragile Bit-Plane Masking Stream ─────────────────────────────
# Set bitcons: true to enable the third training stream.
bitcons: false
bitcons_planes: [0,1,2]      # low bits; masking changes an 8-bit value by at most 7/255
bitcons_align: kl              # js | kl | mse | kl_zscore
temperature: 0.5               # softmax temperature for js alignment
bitcons_alpha: 0.25           # final weight of the complete auxiliary branch
bitcons_ce_weight: 1.0        # masked-view CE weight inside the BitCons branch
bitcons_align_weight: 1.0     # logit alignment weight inside the BitCons branch
bitcons_warmup: 60              # epochs to ramp α from 0 → bitcons_alpha (0 = no warmup)
bitcons_warmup_schedule: linear  # linear | cosine
# ── BitCons Feature Contrastive Loss ──────────────────────────────────────
# NT-Xent on penultimate-layer features; requires bitcons: true
# Positive : (feat_bc_i, feat_adv_i)   reliable-bit vs adversarial, same image
# Negatives: (feat_bc_i, feat_ub_j)    reliable-bit vs unreliable-bit (all j)
#          + (feat_bc_i, feat_adv_j)   cross-sample adversarial (j≠i)
bitcons_contrast: false
bitcons_contrast_lam: 0.001 # weight relative to bc_alpha
bitcons_contrast_temp: 0.5  # NT-Xent temperature τ
# ──────────────────────────────────────────────────────────────────────────
